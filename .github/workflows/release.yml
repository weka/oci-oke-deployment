name: Release one-click stack zips

# Build TWO self-contained zips from the all-in-one stack (stacks/oke-weka) and
# attach them to a GitHub Release:
#   - oke-weka-prod.zip  (production, local-NVMe DenseIO tiers)  <- schema-prod.yaml
#   - oke-weka-dev.zip   (non-production, block-volume drives)   <- schema-dev.yaml
# The two zips share the same Terraform; they differ only in the bundled
# schema.yaml (which pins the flavor and exposes only that variant's sizing).
# The stable URLs
#   https://github.com/<owner>/<repo>/releases/latest/download/oke-weka-prod.zip
#   https://github.com/<owner>/<repo>/releases/latest/download/oke-weka-dev.zip
# are what the two "Deploy to Oracle Cloud" buttons point at.
#
# Versioning is release-please (conventional commits). Two-step by design:
#   1. push to main       -> release-please opens/updates a "chore: release X.Y.Z"
#                            PR with the computed version + CHANGELOG.md. Nothing
#                            is tagged or published yet.
#                            Only feat/fix/perf/revert and breaking changes get
#                            this far: a gate step skips release-please entirely
#                            when everything since the last release is
#                            chore/docs/test/ci/build/style/refactor. That gate
#                            is necessary because release-please itself has no
#                            such setting — its DefaultVersioningStrategy falls
#                            through to a PATCH bump for every type that isn't
#                            feat or breaking, and `hidden: true` in
#                            changelog-sections only hides a commit from
#                            CHANGELOG.md, it does not stop the bump.
#   2. merge that PR      -> release-please tags vX.Y.Z and creates the Release,
#                            then this workflow builds the zips and uploads them.
# Escape hatches:
#   - push a v* tag by hand -> skips release-please, builds and publishes that tag.
#   - workflow_dispatch     -> re-runs release-please to refresh the release PR.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # tag, create releases, upload assets
  pull-requests: write # open/update the release PR

# Serialize runs so two pushes can't race on the release PR or the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' # a hand-pushed tag IS the release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # need history + tags to inspect commits since last release

      # release-please has no setting for "don't release on chore/docs/test":
      # DefaultVersioningStrategy falls through to a PATCH bump for every type
      # that isn't feat or breaking, and `hidden: true` in changelog-sections is
      # render-only. So gate the action instead — if nothing since the last
      # release is releasable, release-please never runs and no PR is opened.
      - name: Any releasable commits since the last release?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Types that justify a release. Anything absent here (chore, docs,
          # test, ci, build, style, refactor) does not — edit this one line to
          # change the policy.
          RELEASABLE: feat|fix|perf|revert
        run: |
          set -euo pipefail

          last="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/${last}^{commit}" >/dev/null; then
            range="${last}..HEAD"
            echo "Comparing against last release ${last}"
          else
            range="HEAD"
            echo "No previous release found — considering the full history"
          fi

          # A breaking change always releases, whatever its type (chore!: etc).
          n_type=$(git log --format='%s' "$range" \
            | grep -cE "^(${RELEASABLE})(\([^)]*\))?!?:" || true)
          n_breaking=$(git log --format='%B' "$range" \
            | grep -cE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' || true)

          {
            echo "### Release gate"
            echo ""
            echo "Range: \`${range}\` — releasable: ${n_type}, breaking: ${n_breaking}"
            echo ""
            echo '```'
            git log --format='%s' "$range" | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$n_type" -gt 0 ] || [ "$n_breaking" -gt 0 ]; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "Only non-releasable commits (chore/docs/test/...) — skipping release-please."
          fi

      # Third-party actions are pinned to an immutable commit SHA, not a version
      # tag: tags are mutable, and CVE-2025-30066 (tj-actions/changed-files) was
      # exactly that — every version tag re-pointed at credential-stealing code.
      # The trailing comment keeps it readable and lets Dependabot bump it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: steps.gate.outputs.releasable == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    needs: release_please
    # Runs when release-please just cut a release, or when a v* tag was pushed by
    # hand (in which case the release-please job is skipped, hence !cancelled()).
    if: >-
      !cancelled() &&
      (github.ref_type == 'tag' ||
       needs.release_please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release_please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || needs.release_please.outputs.tag_name }}

      # Both zips are built in one job so a single upload publishes them
      # together — two parallel jobs would race on the same release.
      - name: Build stack zips
        run: |
          set -euo pipefail
          cd stacks/oke-weka

          for variant in prod dev; do
            # Select the variant's schema as the required schema.yaml at the zip root.
            cp "schema-${variant}.yaml" schema.yaml

            # Pin the flavor in TERRAFORM, not just in the schema. ORM does not
            # submit values for variables marked `visible: false`, so a schema
            # `default:` on a hidden variable never reaches Terraform — the dev zip
            # would silently fall back to variables.tf's default (production) and
            # build DenseIO nodes. Rewriting the default is immune to variable
            # precedence: nothing in ORM can override it, because ORM sends nothing.
            if [ "$variant" = "dev" ]; then
              perl -0pi -e 's/(variable "flavor" \{.*?\n  default     = )"production"/$1"non-production"/s' variables.tf
              grep -q 'default     = "non-production"' variables.tf \
                || { echo "::error::failed to pin flavor=non-production in variables.tf"; exit 1; }
            fi

            # Zip the stack CONTENTS (schema.yaml + crds/ bundled). Exclude the raw
            # schema variants and local-only artifacts.
            zip -qr "${GITHUB_WORKSPACE}/oke-weka-${variant}.zip" . \
              -x 'schema-prod.yaml' 'schema-dev.yaml' \
                 '.terraform/*' '*.tfstate*' 'terraform.tfvars' '*.auto.tfvars' 'orm-vars.json'
            unzip -l "${GITHUB_WORKSPACE}/oke-weka-${variant}.zip"

            # Undo the in-place edits before building the next variant.
            git checkout -- variables.tf
          done

      # gh is preinstalled on the runner, so no third-party action gets a token
      # here. Upload-only on the release-please path, so release-please's
      # CHANGELOG-derived release notes are never overwritten; --generate-notes
      # is only used for a hand-pushed tag, where no release exists yet.
      - name: Upload zips to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "::error::no tag to release"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" oke-weka-prod.zip oke-weka-dev.zip --clobber
          gh release view "$TAG" --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'
