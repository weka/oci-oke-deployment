name: Release one-click stack zips

# Build TWO self-contained zips from the all-in-one stack (stacks/oke-weka) and
# attach them to a GitHub Release:
#   - oke-weka-prod.zip  (production, local-NVMe DenseIO tiers)  <- schema-prod.yaml
#   - oke-weka-dev.zip   (non-production, block-volume drives)   <- schema-dev.yaml
# The two zips share the same Terraform; they differ only in the bundled
# schema.yaml (which pins the flavor and exposes only that variant's sizing).
# The stable URLs
#   https://github.com/<owner>/<repo>/releases/latest/download/oke-weka-prod.zip
#   https://github.com/<owner>/<repo>/releases/latest/download/oke-weka-dev.zip
# are what the two "Deploy to Oracle Cloud" buttons point at.
#
# Versioning is conventional-commit driven and happens IN ONE STEP: a push to
# main computes the next version, and if anything releasable landed, that same
# run tags it, creates the Release, and uploads the zips. There is no release
# PR to merge.
#
#   feat            -> minor        fix | perf | revert -> patch
#   breaking (`!:` or BREAKING CHANGE) -> major
#   everything else (chore/docs/test/ci/build/style/refactor) -> no release
#
# Escape hatch: push a v* tag by hand -> skips version computation, builds and
# publishes that tag.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # create tags, releases, upload assets

# Serialize runs so two pushes can't race on the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' # a hand-pushed tag IS the version
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      released: ${{ steps.bump.outputs.released }}
    steps:
      # Third-party actions are pinned to an immutable commit SHA, not a version
      # tag: tags are mutable, and CVE-2025-30066 (tj-actions/changed-files) was
      # exactly that — every version tag re-pointed at credential-stealing code.
      # The trailing comment keeps it readable and lets Dependabot bump it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # need full history + tags to find the last release

      - name: Compute next version from conventional commits
        id: bump
        env:
          # Types that bump the PATCH digit. feat and breaking changes are
          # handled separately below. Anything absent here does not release at
          # all — edit these two lines to change the policy.
          PATCH_TYPES: fix|perf|revert
          MINOR_TYPES: feat
        run: |
          set -euo pipefail

          # Highest existing v* tag by semver, not by date: a hotfix tagged
          # after a later release must not be mistaken for the latest.
          last="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -n "$last" ]; then
            range="${last}..HEAD"
            base="${last#v}"
            echo "Last release: ${last}"
          else
            range="HEAD"
            base="0.0.0"
            echo "No previous v* tag — considering the full history from 0.0.0"
          fi

          # Reject a malformed tag rather than silently arithmetic-ing on it.
          case "$base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::last tag '${last}' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major="${base%%.*}"; rest="${base#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"

          # A breaking change always releases, whatever its type (chore!: etc).
          n_break=$(git log --format='%B' "$range" \
            | grep -cE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' || true)
          n_minor=$(git log --format='%s' "$range" \
            | grep -cE "^(${MINOR_TYPES})(\([^)]*\))?!?:" || true)
          n_patch=$(git log --format='%s' "$range" \
            | grep -cE "^(${PATCH_TYPES})(\([^)]*\))?!?:" || true)

          # Pre-1.0 note: a breaking change goes to 1.0.0, matching the previous
          # release-please config (bump-minor-pre-major: false). If you'd rather
          # 0.x breaking changes bump the minor, guard this branch on $major.
          if   [ "$n_break" -gt 0 ]; then major=$((major+1)); minor=0; patch=0; why="breaking"
          elif [ "$n_minor" -gt 0 ]; then minor=$((minor+1)); patch=0;          why="feat"
          elif [ "$n_patch" -gt 0 ]; then patch=$((patch+1));                   why="fix/perf/revert"
          else why=""
          fi

          {
            echo "### Release gate"
            echo ""
            echo "Range: \`${range}\` — breaking: ${n_break}, minor: ${n_minor}, patch: ${n_patch}"
            echo ""
            echo '```'
            git log --format='%s' "$range" | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$why" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Only non-releasable commits (chore/docs/test/...) — nothing to release."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No release: nothing releasable since \`${last:-the start of history}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists — refusing to overwrite"; exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${tag} (${why})"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Releasing **${tag}** (${why} bump from ${base})." >> "$GITHUB_STEP_SUMMARY"

  build-and-release:
    needs: version
    # Runs when the version job computed a new version, or when a v* tag was
    # pushed by hand (in which case the version job is skipped, hence
    # !cancelled()).
    if: >-
      !cancelled() &&
      (github.ref_type == 'tag' ||
       needs.version.outputs.released == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # On the main path the tag does not exist yet — `gh release create`
          # below creates it, pointed at exactly this commit.
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

      # Both zips are built in one job so a single upload publishes them
      # together — two parallel jobs would race on the same release.
      - name: Build stack zips
        run: |
          set -euo pipefail
          cd stacks/oke-weka

          for variant in prod dev; do
            # Select the variant's schema as the required schema.yaml at the zip root.
            cp "schema-${variant}.yaml" schema.yaml

            # Pin the flavor in TERRAFORM, not just in the schema. ORM does not
            # submit values for variables marked `visible: false`, so a schema
            # `default:` on a hidden variable never reaches Terraform — the dev zip
            # would silently fall back to variables.tf's default (production) and
            # build DenseIO nodes. Rewriting the default is immune to variable
            # precedence: nothing in ORM can override it, because ORM sends nothing.
            if [ "$variant" = "dev" ]; then
              perl -0pi -e 's/(variable "flavor" \{.*?\n  default     = )"production"/$1"non-production"/s' variables.tf
              grep -q 'default     = "non-production"' variables.tf \
                || { echo "::error::failed to pin flavor=non-production in variables.tf"; exit 1; }
            fi

            # Zip the stack CONTENTS (schema.yaml + crds/ bundled). Exclude the raw
            # schema variants and local-only artifacts.
            zip -qr "${GITHUB_WORKSPACE}/oke-weka-${variant}.zip" . \
              -x 'schema-prod.yaml' 'schema-dev.yaml' \
                 '.terraform/*' '*.tfstate*' 'terraform.tfvars' '*.auto.tfvars' 'orm-vars.json'
            unzip -l "${GITHUB_WORKSPACE}/oke-weka-${variant}.zip"

            # Undo the in-place edits before building the next variant.
            git checkout -- variables.tf
          done

      # The release is created only after the zips build, so a failed build
      # never leaves a published-but-empty release behind. `--target` makes
      # `gh` create the tag itself, at this exact commit.
      #
      # gh is preinstalled on the runner, so no third-party action gets a token
      # here. Note that a tag created with GITHUB_TOKEN does not re-trigger this
      # workflow's `tags: v*` filter — that is deliberate, the build below is
      # already part of this same run.
      - name: Create release and upload zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "::error::no tag to release"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --target "$GITHUB_SHA" \
                 --title "$TAG" \
                 --generate-notes
          gh release upload "$TAG" oke-weka-prod.zip oke-weka-dev.zip --clobber
          gh release view "$TAG" --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'
