apiVersion: weka.weka.io/v1alpha1
kind: WekaClient
metadata:
  name: client-dev
  namespace: default
spec:
  autoRemoveTimeout: 0s
  coresNum: 1
  image: quay.io/weka.io/weka-in-container:5.1.24
  imagePullSecret: quay-io-robot-secret
  targetCluster:
    name: dev
    namespace: default
%{ if length(network_subnets) > 0 ~}
  # MUST match the WekaCluster's network block (03-wekacluster.yaml). Without it
  # the client falls back to the virtual-function path and requests the extended
  # resource weka.io/weka-nics, which NOTHING advertises when the data plane uses
  # pre-attached NICs (no device plugin is deployed). The client pods then sit
  # Pending forever on "Insufficient weka.io/weka-nics" while the cluster itself
  # reports Ready — containers that select by subnet request zero NICs.
  network:
    selectors:
%{ for subnet in network_subnets ~}
      - subnet: ${subnet}
%{ endfor ~}
%{ endif ~}
