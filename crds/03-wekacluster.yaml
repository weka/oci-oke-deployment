apiVersion: weka.weka.io/v1alpha1
kind: WekaCluster
metadata:
  name: dev
  namespace: default
spec:
  # Rendered by weka.tf via templatefile() from the selected sizing tier
  # (production) or node_count (non-production). One compute + one drive container
  # per worker node; numDrives = local NVMe drives per node; the protection scheme
  # (stripeWidth + redundancyLevel + hotSpare) is derived so SW+RL+HS == node count.
  dynamicTemplate:
    computeContainers: ${compute_containers}
    driveContainers: ${drive_containers}
    driveCores: ${drive_cores}
    numDrives: ${num_drives}
  gracefulDestroyDuration: 0s
  hotSpare: ${hot_spare}
  image: quay.io/weka.io/weka-in-container:5.1.24
  imagePullSecret: quay-io-robot-secret
  ports:
    basePort: 15000
  redundancyLevel: ${redundancy_level}
  stripeWidth: ${stripe_width}
  template: dynamic
%{ if eth_device != "" ~}
  # Bare metal: DPDK binds the node's PHYSICAL interface directly, so ensure-nics
  # (secondary VNICs via the OCI Core API) is disabled — see weka.tf. ethDevice is
  # shape-specific; verify with `ip -br link show` on a worker.
  network:
    udpMode: ${udp_mode}
    ethDevice: ${eth_device}
    allocateVfPerIoNode: ${allocate_vf_per_io_node}
%{ endif ~}
