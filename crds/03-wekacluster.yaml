apiVersion: weka.weka.io/v1alpha1
kind: WekaCluster
metadata:
  name: dev
  namespace: default
spec:
  # Rendered by weka.tf via templatefile(). The protection scheme
  # (stripeWidth + redundancyLevel + hotSpare) is derived so SW+RL+HS == node count.
%{ if length(dynamic_template) > 0 ~}
  dynamicTemplate:
%{ for field, value in dynamic_template ~}
    ${field}: ${value}
%{ endfor ~}
%{ endif ~}
  gracefulDestroyDuration: 0s
  hotSpare: ${hot_spare}
  image: quay.io/weka.io/weka-in-container:5.1.24
  imagePullSecret: quay-io-robot-secret
  ports:
    basePort: 15000
  redundancyLevel: ${redundancy_level}
  stripeWidth: ${stripe_width}
  template: dynamic
  # See the traces note in weka.tf.
  tracesConfiguration:
    maxCapacityPerIoNode: ${traces_max_capacity_per_io_node}
    ensureFreeSpace: ${traces_free_space_gb}
%{ if length(network_subnets) > 0 ~}
  # Bare metal: the data NICs are already attached, so WEKA picks the matching NIC
  # per node from the data-path subnet and ensure-nics is not applied (see weka.tf).
  # Selecting by subnet — not by a shape-specific ethDevice name — because the
  # subnet is our own configuration and the guest device name is not knowable here.
  network:
    selectors:
%{ for subnet in network_subnets ~}
      - subnet: ${subnet}
%{ endfor ~}
%{ endif ~}
